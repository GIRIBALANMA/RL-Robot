<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steel Sentinel – Jointed Robot on the Road</title>
<style>
:root{color-scheme:dark;--panel:rgba(12,15,24,.8);--fg:#e8ecf4;--mut:#9aa3b5;--acc:#ff3b2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#1b2a52;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg)}
canvas{display:block;position:fixed;inset:0}
.hud{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:260px;font-size:12px;line-height:1.5;color:var(--fg);text-shadow:0 1px 4px #000}
.hud b{font-size:15px;letter-spacing:.12em;color:var(--acc)}
.panel{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);width:210px;max-height:62vh;overflow:auto;background:var(--panel);border:1px solid #ffffff22;border-radius:10px;padding:8px 10px;backdrop-filter:blur(6px);font-size:11px}
.panel summary{cursor:pointer;font-weight:600;font-size:12px}
.panel label{display:block;margin-top:6px;color:var(--mut)}
.panel input{width:100%;accent-color:var(--acc)}
.bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.bar button{background:var(--panel);color:var(--fg);border:1px solid #ffffff33;border-radius:10px;padding:12px 18px;font-size:15px;touch-action:none;user-select:none;cursor:pointer}
.bar button:active{background:var(--acc)}
</style></head><body>
<div class="hud"><b>STEEL SENTINEL</b><br>A / D or ← / → walk · Shift run · W wave · ↑ jump · ↓ prone (hold)<br>Drag to orbit · wheel or pinch to zoom<br>Open “Joints” to pose each joint.</div>
<details class="panel" open><summary>Joints</summary><div id="sl"></div></details>
<div class="bar"><button id="bl">◀</button><button id="bj">Jump</button><button id="bp">Prone</button><button id="bw">Wave</button><button id="br">▶</button><button id="bx">Reset</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE;
const ren=new T.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
ren.shadowMap.enabled=true;document.body.appendChild(ren.domElement);
const scene=new T.Scene();
// sky
const cv=document.createElement('canvas');cv.width=2;cv.height=256;
const cx=cv.getContext('2d'),gr=cx.createLinearGradient(0,0,0,256);
[[0,'#1b2a52'],[.3,'#7a4f8a'],[.47,'#ff9a5a'],[.5,'#ffd08a'],[.52,'#e39a78'],[1,'#e39a78']].forEach(a=>gr.addColorStop(a[0],a[1]));
cx.fillStyle=gr;cx.fillRect(0,0,2,256);const dome=new T.Mesh(new T.SphereGeometry(900,32,16),new T.MeshBasicMaterial({map:new T.CanvasTexture(cv),side:T.BackSide,fog:false,depthWrite:false}));scene.add(dome);
scene.fog=new T.Fog(0xe39a78,80,620);
const cam=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,1500);
scene.add(new T.HemisphereLight(0xffc89a,0x33382e,.9));
const sun=new T.DirectionalLight(0xffb27a,2.2);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:120});
sun.shadow.mapSize.set(1024,1024);scene.add(sun,sun.target);

// helpers
const M=(c,m,r)=>new T.MeshStandardMaterial({color:c,metalness:m,roughness:r});
const steel=M(0x9aa1ab,.95,.28),dark=M(0x2a2d33,.85,.45),plate=M(0xc3c9d1,.95,.2);
const glow=new T.MeshStandardMaterial({color:0x330000,emissive:0xff2a1a,emissiveIntensity:2});
const add=(p,g,m,x=0,y=0,z=0)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);p.add(o);return o};
const grp=(p,x=0,y=0,z=0)=>{const o=new T.Group();o.position.set(x,y,z);p.add(o);return o};
const B=(w,h,d)=>new T.BoxGeometry(w,h,d),C=(a,b,h,s=10)=>new T.CylinderGeometry(a,b,h,s),S=r=>new T.SphereGeometry(r,16,12);

// scenery
const ground=add(scene,new T.PlaneGeometry(3000,3000),M(0x4a5440,0,1),0,0,0);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;
add(scene,B(720,.1,10.5),M(0x6b6459,0,1),0,.04,0).receiveShadow=true;
add(scene,B(720,.12,8),M(0x23252b,0,.9),0,.06,0).receiveShadow=true;
const lineM=new T.MeshBasicMaterial({color:0xf2e6b8}),dashG=B(3.5,.02,.2);
for(let x=-350;x<=350;x+=8)add(scene,dashG,lineM,x,.13,0);
[-3.6,3.6].forEach(z=>add(scene,B(720,.02,.12),new T.MeshBasicMaterial({color:0xffffff}),0,.13,z));
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
for(let i=0;i<92;i++){const e=i>=80,mx=e?(i%2?1:-1)*(440+rnd()*60):-500+(i>>1)*25+rnd()*10,mz=e?(rnd()-.5)*300:(i%2?1:-1)*(190+rnd()*140);
  const h=40+rnd()*80,r=30+rnd()*45,col=new T.Color().setHSL(.62+rnd()*.05,.25,.22+rnd()*.12);
  add(scene,new T.ConeGeometry(r,h,6),new T.MeshStandardMaterial({color:col,roughness:1,flatShading:true}),mx,h/2,mz);
}
const trunkG=C(.25,.3,1.6,6),coneG=new T.ConeGeometry(1.5,3.2,7),treeM=M(0x1f3a2a,0,1),trunkM=M(0x4a3426,0,1);
for(let i=0;i<170;i++){
  const t=grp(scene,-340+rnd()*680,0,(rnd()<.5?-1:1)*(9+rnd()*30)),s=.8+rnd()*1.4;t.scale.setScalar(s);
  add(t,trunkG,trunkM,0,.8,0);add(t,coneG,treeM,0,2.8,0);add(t,coneG,treeM,0,4,0).scale.setScalar(.75);
}
const poleG=C(.08,.1,6,6),poleM=M(0x3a3d44,.5,.6),lampM=new T.MeshBasicMaterial({color:0xffe2a8});
for(let x=-340;x<=340;x+=30)[-1,1].forEach(s=>{const p=grp(scene,x,0,s*5.6);add(p,poleG,poleM,0,3,0);add(p,B(.5,.15,.9),poleM,0,6,-s*.3);add(p,B(.3,.06,.5),lampM,0,5.9,-s*.4)});
const sunMesh=add(scene,new T.SphereGeometry(20,24,16),new T.MeshBasicMaterial({color:0xffd8a0,fog:false}),150,32,-520);

// robot (faces +z at idle): white and blue humanoid, helmet with black visor, black joints
const wht=M(0xf1f3f7,.15,.35),blu=M(0x4b6ca4,.25,.4),blk=M(0x14171c,.5,.4),red=M(0xd8344a,.2,.5);
const bot=new T.Group();scene.add(bot);
const hips=grp(bot,0,2.55,0);
add(hips,B(1.0,.4,.65),wht);add(hips,C(.38,.38,.2,16),blk,0,.2,0);
const torso=grp(hips,0,.25,0);
add(torso,B(.8,.2,.55),blk,0,.05,0);
add(torso,B(1.1,.9,.7),blu,0,.65,0);
add(torso,B(1.35,.8,.8),wht,0,1.3,0);
add(torso,B(.55,.7,.1),blu,0,1.3,.43);
add(torso,B(.3,.4,.1),wht,0,.65,.36);
const neck=grp(torso,0,1.7,0);add(neck,C(.13,.16,.25,10),blu,0,.05,0);
const head=grp(neck,0,.15,0);
add(head,S(.42),wht,0,.4,0).scale.set(1,1.05,1.1);
add(head,S(.3),blk,0,.38,.3).scale.set(.95,.7,.7);
add(head,B(.1,.03,.55),glow,0,.84,0);
[-1,1].forEach(s=>{add(head,C(.15,.15,.12,16),blu,s*.43,.4,0).rotation.z=Math.PI/2;add(head,C(.09,.09,.14,12),wht,s*.43,.4,0).rotation.z=Math.PI/2});
const mkArm=s=>{
  const sh=grp(torso,s*.9,1.5,0);
  add(sh,S(.3),wht);add(sh,B(.5,.22,.5),blu,0,.22,0);
  add(sh,C(.2,.17,1.2,12),wht,0,-.65,0);add(sh,C(.205,.205,.1,12),red,0,-.45,0);
  const el=grp(sh,0,-1.3,0);add(el,S(.2),blk);
  add(el,C(.17,.14,1.05,12),blu,0,-.6,0);add(el,C(.175,.16,.45,12),wht,0,-.25,0);
  const wr=grp(el,0,-1.2,0);add(wr,B(.26,.3,.26),blk,0,-.1,0);
  return{sh,el};};
const mkLeg=s=>{
  const hp=grp(hips,s*.3,-.15,0);add(hp,S(.22),blk);
  add(hp,C(.27,.2,1.2,14),wht,0,-.65,0);
  for(let i=0;i<3;i++)add(hp,B(.06,.04,.04),red,s*.05,-.4-i*.1,.25).rotation.z=.4;
  const kn=grp(hp,0,-1.2,0);add(kn,S(.24),blk);add(kn,B(.3,.3,.15),blu,0,0,.22);
  add(kn,C(.2,.15,1.1,12),blu,0,-.6,0);add(kn,B(.28,.8,.1),wht,0,-.55,.2);
  const ft=grp(kn,0,-1.15,0);
  add(ft,B(.42,.2,.9),wht,0,.02,.2);add(ft,B(.43,.05,.5),blu,0,.05,.2);add(ft,B(.44,.06,.92),blk,0,-.07,.2);
  return{hp,kn,ft};};
const aR=mkArm(1),aL=mkArm(-1),lR=mkLeg(1),lL=mkLeg(-1);
bot.traverse(o=>{if(o.isMesh)o.castShadow=true});

// joints: [key,label,group,axis,min,max,sign]
const J=[
 ['hy','Head turn',head,'y',-1,1,1],['hx','Head tilt',head,'x',-.6,.6,1],['wt','Waist twist',torso,'y',-.8,.8,1],
 ['rs','R shoulder swing',aR.sh,'x',-2.5,2.5,-1],['rr','R arm raise',aR.sh,'z',0,2.8,1],['re','R elbow',aR.el,'x',0,2.4,-1],
 ['ls','L shoulder swing',aL.sh,'x',-2.5,2.5,-1],['lr','L arm raise',aL.sh,'z',0,2.8,-1],['le','L elbow',aL.el,'x',0,2.4,-1],
 ['rh','R hip',lR.hp,'x',-1.2,1.2,-1],['rk','R knee',lR.kn,'x',0,2.2,1],
 ['lh','L hip',lL.hp,'x',-1.2,1.2,-1],['lk','L knee',lL.kn,'x',0,2.2,1],
 ['ra','R ankle',lR.ft,'x',-.8,.8,1],['la','L ankle',lL.ft,'x',-.8,.8,1]];
const P={};J.forEach(j=>P[j[0]]=0);
const sl=document.getElementById('sl');
J.forEach(j=>{const l=document.createElement('label');l.textContent=j[1];
  const i=document.createElement('input');i.type='range';i.min=j[4];i.max=j[5];i.step=.01;i.value=0;
  i.oninput=()=>P[j[0]]=+i.value;i.dataset.k=j[0];l.appendChild(i);sl.appendChild(l);});
const resetPose=()=>{J.forEach(j=>P[j[0]]=0);sl.querySelectorAll('input').forEach(i=>i.value=0)};

// input
const keys={};let btn=0,waveT=0,jy=0,vy=0,pr=0,ja=0,pbtn=0;const jump=()=>{if(jy===0&&pr<.3)vy=10};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='w')waveT=3;if(e.key==='ArrowUp'){e.preventDefault();jump()}if(e.key==='ArrowDown')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const hold=(id,d)=>{const b=document.getElementById(id);
  b.onpointerdown=()=>btn=d;b.onpointerup=b.onpointerleave=b.onpointercancel=()=>{if(btn===d)btn=0}};
hold('bl',-1);hold('br',1);document.getElementById('bj').onclick=jump;const pb=document.getElementById('bp');pb.onpointerdown=()=>pbtn=1;pb.onpointerup=pb.onpointerleave=pb.onpointercancel=()=>pbtn=0;
document.getElementById('bw').onclick=()=>waveT=3;
document.getElementById('bx').onclick=resetPose;

// loop
const orb={th:.35,p:1.3,r:15},tgt=new T.Vector3(0,2.6,0),ptr=new Map();let pd=0,auto=1;
const cvEl=ren.domElement;cvEl.style.touchAction='none';
cvEl.addEventListener('pointerdown',e=>{auto=0;cvEl.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);pd=0});
cvEl.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;
  if(ptr.size===1){orb.th-=(e.clientX-p[0])*.008;orb.p=Math.max(.15,Math.min(1.62,orb.p-(e.clientY-p[1])*.006))}
  ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size===2){const [a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)orb.r=Math.max(5,Math.min(60,orb.r*pd/d));pd=d}});
const pup=e=>{ptr.delete(e.pointerId);pd=0};cvEl.addEventListener('pointerup',pup);cvEl.addEventListener('pointercancel',pup);
cvEl.addEventListener('wheel',e=>{e.preventDefault();orb.r=Math.max(5,Math.min(60,orb.r*(1+e.deltaY*.001)))},{passive:false});
let ph=0,wb=0,yaw=0,t=0,last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;
  const dir=btn||((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0);
  const wantP=(pbtn||keys.arrowdown)?1:0;pr+=((jy>0?0:wantP)-pr)*Math.min(1,dt*7);const run=keys.shift?1.8:1,spd=5*run*(1-.65*pr);
  if(jy>0||vy>0){vy-=26*dt;jy+=vy*dt;if(jy<=0){jy=0;vy=0}}ja+=((jy>0?1:0)-ja)*Math.min(1,dt*10);
  bot.position.x=Math.max(-330,Math.min(330,bot.position.x+dir*spd*dt));
  wb+=((dir?1:0)-wb)*Math.min(1,dt*8);
  ph+=dir*dt*spd*1.35;
  yaw+=((dir>0?Math.PI/2:dir<0?-Math.PI/2:0)-yaw)*Math.min(1,dt*6);bot.rotation.order='YXZ';bot.rotation.y=yaw;bot.rotation.x=pr*Math.PI/2;bot.position.y=jy+pr*.55;
  const o={};J.forEach(j=>o[j[0]]=P[j[0]]);
  const s=Math.sin(ph),c=Math.cos(ph),kn=(x)=>Math.max(0,x)*1.0;
  o.rh+=s*.6*wb;o.lh-=s*.6*wb;o.rk+=kn(c)*wb;o.lk+=kn(-c)*wb;
  o.rs-=s*.5*wb;o.ls+=s*.5*wb;o.re+=.5*wb;o.le+=.5*wb;o.wt+=s*.12*wb;
  o.ra+=(o.rh-o.rk)*.7*wb;o.la+=(o.lh-o.lk)*.7*wb;
  if(!dir)o.hy+=Math.sin(t*.8)*.12;
  o.rk+=.9*ja;o.lk+=.9*ja;o.rs+=1.4*ja;o.ls+=1.4*ja;o.re+=.6*ja;o.le+=.6*ja;o.rh+=.5*ja;o.lh+=.5*ja;
  o.hx-=pr;o.rr+=.5*pr;o.lr+=.5*pr;o.re+=pr;o.le+=pr;
  o.ra+=.5*ja+.6*pr;o.la+=.5*ja+.6*pr;
  if(waveT>0){waveT-=dt;o.rr=2.5;o.rs=0;o.re=1.1+Math.sin(t*10)*.5}
  J.forEach(j=>j[2].rotation[j[3]]=o[j[0]]*j[6]);
  hips.position.y=2.55+Math.abs(c)*.07*wb;
  glow.emissiveIntensity=1.6+Math.sin(t*3)*.5;
  // camera + lights
  const bx=bot.position.x;
  tgt.x+=(bx-tgt.x)*Math.min(1,dt*4);if(auto&&t<6)orb.th+=dt*.25;cam.position.set(tgt.x+orb.r*Math.sin(orb.p)*Math.sin(orb.th),tgt.y+orb.r*Math.cos(orb.p),orb.r*Math.sin(orb.p)*Math.cos(orb.th));dome.position.copy(cam.position);
  cam.lookAt(tgt);
  sun.position.set(bx+30,28,18);sun.target.position.set(bx,0,0);
  sunMesh.position.copy(cam.position).add(new T.Vector3(150,32,-520));
  ren.render(scene,cam);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
</script></body></html>
